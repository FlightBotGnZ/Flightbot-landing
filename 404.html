<!DOCTYPE html>
<html lang="es" class="scroll-smooth dark" data-color="ruby">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada (404) · FlightBot</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vercel Web Analytics (mismo dominio, compatible con CSP script-src 'self') -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
        }
      }
    };
    (function() {
      const savedColor = localStorage.getItem('fb_theme_color') || 'ruby';
      const savedMode = localStorage.getItem('fb_theme_mode') || 'dark';
      document.documentElement.setAttribute('data-color', savedColor);
      if (savedMode === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <style>
    :root, html, html[data-color="ruby"] {
      --brand-primary: #e11d48;
      --brand-hover: #be123c;
    }
  </style>
</head>
<body class="dark:bg-slate-950 dark:text-slate-100 bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-rose-600 selection:text-white">
  
  <!-- Header Minimalista -->
  <header class="border-b dark:border-slate-800/80 border-slate-200/80 px-6 py-4">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-black text-xl tracking-tight">
        <span class="text-2xl">✈️</span>
        <span class="bg-gradient-to-r from-rose-500 to-amber-500 bg-clip-text text-transparent">FlightBot</span>
      </a>
      <a href="/guias" class="text-xs font-bold text-rose-500 hover:underline">
        Explorar Guías &rarr;
      </a>
    </div>
  </header>

  <!-- Contenido 404 -->
  <main class="max-w-lg mx-auto px-6 py-20 text-center my-auto">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-rose-500/10 border border-rose-500/20 text-4xl mb-6 shadow-inner">
      🧭
    </div>
    <div class="text-xs font-mono font-extrabold uppercase tracking-widest text-rose-500 mb-2">Error 404 · Destino no encontrado</div>
    <h1 class="text-3xl sm:text-4xl font-extrabold mb-4 tracking-tight">Parece que este vuelo cambió de rumbo</h1>
    <p class="text-sm dark:text-slate-400 text-slate-600 mb-8 leading-relaxed">
      La página que estás buscando no existe o fue reubicada en nuestro catálogo editorial de viajes.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/guias" class="px-6 py-3 rounded-xl text-white font-bold text-sm shadow-lg shadow-rose-500/20 transition-all hover:brightness-110 flex items-center justify-center gap-2" style="background-color: var(--brand-primary);">
        <span>📖</span> Ver Catálogo de Guías
      </a>
      <a href="/" class="px-6 py-3 rounded-xl dark:bg-slate-900 bg-white dark:border-slate-800 border-slate-200 border font-semibold text-sm hover:border-slate-400 transition-all flex items-center justify-center gap-2">
        <span>🏠</span> Ir al Inicio
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t dark:border-slate-800/80 border-slate-200/80 px-6 py-4 text-center text-xs dark:text-slate-500 text-slate-500">
    © 2026 FlightBot · Radar de Vuelos & Guías de Viaje
  </footer>
</body>
</html>
