<svg viewBox="2 -4 24 25" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cuello / Hombros sutiles de apoyo (tipo DNI / Avatar) -->
  <path d="M 6 25 Q 14 20 22 25" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" opacity="0.9"/>

  <!-- CABEZA DEL ROBOT (Blanco cerámico pulido) -->
  <rect x="5.5" y="6" width="17" height="13" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
  
  <!-- ANTENA SUPERIOR CON EMISOR DE ALERTAS -->
  <line x1="14" y1="6" x2="14" y2="2" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <g id="antenna-pulse">
    <circle cx="14" cy="1.8" r="1.7" fill="#e11d48"/>
    <circle cx="14" cy="1.8" r="3.4" stroke="#e11d48" stroke-width="0.5" stroke-dasharray="1 1" opacity="0.8"/>
    <circle cx="14" cy="1.8" r="5.2" stroke="#e11d48" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- Visor Oscuro de Cristal Frontal -->
  <rect x="8" y="9" width="12" height="6.5" rx="2.5" fill="#0f172a"/>
  <!-- Ojos Inteligentes Cyan LED -->
  <circle cx="11" cy="12.2" r="1.3" fill="#38bdf8"/>
  <circle cx="17" cy="12.2" r="1.3" fill="#38bdf8"/>
  <circle cx="11.4" cy="11.8" r="0.4" fill="#ffffff"/>
  <circle cx="17.4" cy="11.8" r="0.4" fill="#ffffff"/>

  <!-- Brillo sutil de curvatura superior -->
  <path d="M 8.5 7.5 Q 14 6.8 19.5 7.5" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" opacity="0.9"/>
</svg>
